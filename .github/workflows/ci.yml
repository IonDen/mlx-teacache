name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # allows the parity job to be triggered manually

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: pip install uv
      - name: Install lint group
        run: uv sync --no-install-project --group lint
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: pip install uv
      - name: Install typecheck group
        run: uv sync --no-install-project --group typecheck
      - run: uv run mypy src/mlx_teacache

  test-pure-core:
    # MLX has no Linux wheel (libmlx.so is macOS-only), so even the "pure
    # core" job runs on macOS. The "pure" qualifier here means the [mflux]
    # extra is NOT installed — we still need MLX itself as a hard dependency.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: pip install uv
      - name: Install test-core (NO mflux extra)
        run: uv sync --group test-core
      - name: Run pure-core tests (no coverage gate — collected by `coverage` job)
        run: uv run pytest -m "not parity and not slow and not benchmark and not network and not mflux" -v --cov=mlx_teacache --cov-branch --cov-report=xml:coverage-core.xml
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-core
          path: coverage-core.xml

  test-mflux:
    runs-on: macos-14
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: pip install uv
      - name: Install test-mflux
        run: uv sync --group test-mflux
      - name: Run tests (no parity, no slow, no benchmark)
        run: uv run pytest -m "not parity and not slow and not benchmark and not network" -v --cov=mlx_teacache --cov-branch --cov-report=xml:coverage-mflux-${{ matrix.python-version }}.xml
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-mflux-${{ matrix.python-version }}
          path: coverage-mflux-${{ matrix.python-version }}.xml

  coverage:
    needs: [test-pure-core, test-mflux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install coverage
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Combine coverage XMLs and gate
        # Each test-* job uploaded a coverage XML; combine them and fail
        # below a floor.
        #
        # Why not 100%: about a third of `api.py` and the mflux integration
        # surface are only reachable when a real `Flux1` / `Flux2Klein` is
        # patched — those paths live behind `pytest.mark.parity` and need
        # gated HuggingFace weights (FLUX.1-dev terms-acceptance), so they
        # cannot run on a GitHub-hosted runner without secrets and license
        # acceptance. Parity tests cover those paths locally and via the
        # `workflow_dispatch`-only `test-parity` job. The floor here gates
        # *regressions in the stub-testable surface* — anything reachable
        # without real model weights.
        run: |
          python -c "
          import xml.etree.ElementTree as ET, sys, glob
          xmls = sorted(glob.glob('coverage-*.xml'))
          if not xmls: sys.exit('no coverage XMLs found')
          lines_covered = set(); lines_total = set()
          for xml in xmls:
              tree = ET.parse(xml); root = tree.getroot()
              for cls in root.iter('class'):
                  fname = cls.get('filename', '')
                  for line in cls.iter('line'):
                      key = (fname, int(line.get('number')))
                      lines_total.add(key)
                      if int(line.get('hits', '0')) > 0:
                          lines_covered.add(key)
          missed = lines_total - lines_covered
          pct = 100 * len(lines_covered) / max(len(lines_total), 1)
          print(f'Combined line coverage: {pct:.2f}% ({len(lines_covered)}/{len(lines_total)})')
          if missed:
              print('Missed lines (first 30):')
              for fname, lineno in sorted(missed)[:30]:
                  print(f'  {fname}:{lineno}')
          # FLOOR rationale: ~35% of the codebase is parity-only-testable
          # (FLUX.1 ProxyFlux1Transformer + the FLUX.2 _predict closure +
          # the gated forward functions, now living inside each variant's
          # integration.py, plus most of api.py's apply_teacache dispatch and
          # handle.py's restore paths). Those paths need a real mflux model
          # loaded on Apple Silicon and are exercised by the parity job
          # (test-parity), not by test-pure-core / test-mflux. The combined
          # non-parity gate is therefore inherently capped.
          #
          # Floor history:
          # - pre-v0.4.1: ~70%, floor 65% (5pp headroom)
          # - v0.4.1: added ~163 LoC of parity-only CFG forward code, dropping
          #   to ~67%; floor stayed at 65% (2pp headroom)
          # - v0.6.0: per-variant cores added ~500 LoC across 6 variant
          #   integrations (most of it parity-only forward port + apply()),
          #   dropping the combined rate to ~64%. Floor lowered to 62% to
          #   restore the ~2pp headroom.
          #
          # The real release-quality gate is the parity job + SSIM PR-gate on
          # real weights, not this floor. See PR #9 for the v0.6.0 adjustment
          # rationale.
          FLOOR = 62.0
          sys.exit(0 if pct >= FLOOR else 1)
          "

  test-parity:
    # Parity tests need real FLUX weights from a gated HuggingFace repo
    # (black-forest-labs/FLUX.1-dev) which requires user terms-acceptance
    # and an HF auth token. They are inherently local/nightly, not a
    # per-PR gate. Trigger manually via `gh workflow run CI` when needed.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    needs: test-mflux
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: pip install uv
      - name: Install test-mflux
        run: uv sync --group test-mflux
      - name: Run parity tests
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run pytest -m parity -v
