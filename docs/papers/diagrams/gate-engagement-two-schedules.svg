<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="736px" preserveAspectRatio="none" style="width:1501px;height:736px;background:#FFFFFF;" version="1.1" viewBox="0 0 1501 736" width="1501px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="1"><text fill="#111827" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="449.7021" x="522.4146" y="20.7803">One gate, two schedules: where the skip branch is actually reached</text></g><!--entity signal--><g class="entity" data-qualified-name="signal" data-source-line="16" id="ent0001"><rect fill="#EDE9FE" height="62" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="317.3018" x="528.4908" y="42"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="92.6133" x="538.4908" y="62.7803">Denoising step</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="297.3018" x="538.4908" y="76.7803">Cheap input signal: relative-L1 of the modulated</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="238.9229" x="538.4908" y="90.7803">block-0 input against the previous step</text></g><!--entity poly--><g class="entity" data-qualified-name="poly" data-source-line="18" id="ent0002"><rect fill="#FEF3C7" height="48" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="315.7363" x="529.2708" y="165"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="194.5576" x="539.2708" y="185.7803">Calibrated degree-4 polynomial</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="295.7363" x="539.2708" y="199.7803">predicts the body-output change from the signal</text></g><!--entity acc--><g class="entity" data-qualified-name="acc" data-source-line="19" id="ent0003"><rect fill="#FEF3C7" height="48" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="271.3506" x="551.4608" y="274"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="199.999" x="561.4608" y="294.7803">Accumulator adds the prediction</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="561.4608" y="308.7803">(running total since the last full compute)</text></g><!--entity gate--><g class="entity" data-qualified-name="gate" data-source-line="20" id="ent0004"><rect fill="#FEF3C7" height="48" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="205.2197" x="584.5308" y="383"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="185.2197" x="594.5308" y="403.7803">Accumulated prediction under</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="175.1094" x="594.5308" y="417.7803">rel_l1_thresh (default 0.20)?</text></g><!--entity skip--><g class="entity" data-qualified-name="skip" data-source-line="22" id="ent0005"><rect fill="#DCFCE7" height="48" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="303.6777" x="366.3008" y="506"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="160.2959" x="376.3008" y="526.7803">Skip the transformer body</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="283.6777" x="376.3008" y="540.7803">Reuse the cached residual; prelude + tail only</text></g><!--entity compute--><g class="entity" data-qualified-name="compute" data-source-line="23" id="ent0006"><rect fill="#F8FAFC" height="48" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="303.2607" x="730.5108" y="506"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="147.082" x="740.5108" y="526.7803">Compute the step in full</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="283.2607" x="740.5108" y="540.7803">Refresh the cache; reset the accumulator to 0</text></g><!--entity dev--><g class="entity" data-qualified-name="dev" data-source-line="25" id="ent0007"><rect fill="#DCFCE7" height="76" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="314.1572" x="347.0608" y="629"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="189.1025" x="357.0608" y="649.7803">FLUX.1-dev, 25-step schedule</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="266.8955" x="357.0608" y="663.7803">Predicted changes stay small for stretches,</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="238.8887" x="357.0608" y="677.7803">so the accumulator crawls toward 0.20</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="294.1572" x="357.0608" y="691.7803">Measured (v0.6.3 report): 6 of 25 steps skipped</text></g><!--entity klein--><g class="entity" data-qualified-name="klein" data-source-line="26" id="ent0008"><rect fill="#FECACA" height="76" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="398.2598" x="696.0108" y="629"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="296.4883" x="706.0108" y="649.7803">FLUX.2 Klein 4B / 9B, 8-step distilled schedules</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="308.1709" x="706.0108" y="663.7803">For 9B, the shipped fit predicts above 0.20 across</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="378.2598" x="706.0108" y="677.7803">the observed signal range 0.1316-0.4498 (lowest about 0.27)</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="296.5156" x="706.0108" y="691.7803">The v0.3.0 release notes report no skipped step</text></g><!--link signal to poly--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="28" id="lnk9"><path d="M687.1408,104.25 C687.1408,123.25 687.1408,142.37 687.1408,159.84" fill="none" id="signal-to-poly" style="stroke:#4B5563;stroke-width:1;"/><polygon fill="#4B5563" points="687.1408,164.84,691.1408,155.84,687.1408,159.84,683.1408,155.84,687.1408,164.84" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link poly to acc--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="29" id="lnk10"><path d="M687.1408,213.48 C687.1408,231.32 687.1408,250.75 687.1408,268.57" fill="none" id="poly-to-acc" style="stroke:#4B5563;stroke-width:1;"/><polygon fill="#4B5563" points="687.1408,273.57,691.1408,264.57,687.1408,268.57,683.1408,264.57,687.1408,273.57" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link acc to gate--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="30" id="lnk11"><path d="M687.1408,322.48 C687.1408,340.32 687.1408,359.75 687.1408,377.57" fill="none" id="acc-to-gate" style="stroke:#4B5563;stroke-width:1;"/><polygon fill="#4B5563" points="687.1408,382.57,691.1408,373.57,687.1408,377.57,683.1408,373.57,687.1408,382.57" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link gate to skip--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="31" id="lnk12"><path d="M654.5508,431.33 C624.7208,452.69 584.8663,481.2293 554.9763,502.6293" fill="none" id="gate-to-skip" style="stroke:#4B5563;stroke-width:1;"/><polygon fill="#4B5563" points="550.9108,505.54,560.5572,503.5531,554.9763,502.6293,555.9001,497.0484,550.9108,505.54" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#374151" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="20.23" x="613.7608" y="472.0103">yes</text></g><!--link gate to compute--><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" data-link-type="dependency" data-source-line="32" id="lnk13"><path d="M724.7408,431.33 C759.1608,452.69 805.5926,481.5033 840.0726,502.9033" fill="none" id="gate-to-compute" style="stroke:#4B5563;stroke-width:1;"/><polygon fill="#4B5563" points="844.3208,505.54,838.7833,497.3953,840.0726,502.9033,834.5646,504.1926,844.3208,505.54" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#374151" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="14.46" x="797.3108" y="472.0103">no</text></g><!--link skip to dev--><g class="link" data-entity-1="ent0005" data-entity-2="ent0007" data-link-type="dependency" data-source-line="33" id="lnk14"><path d="M515.7308,554.21 C513.6108,574.64 511.0063,599.7866 508.5363,623.6166" fill="none" id="skip-to-dev" style="stroke:#4B5563;stroke-width:1;"/><polygon fill="#4B5563" points="508.0208,628.59,512.9274,620.0504,508.5363,623.6166,504.97,619.2256,508.0208,628.59" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#374151" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="111.2998" x="513.3908" y="595.0103">reached repeatedly</text></g><!--link compute to klein--><g class="link" data-entity-1="ent0006" data-entity-2="ent0008" data-link-type="dependency" data-source-line="34" id="lnk15"><path d="M884.3708,554.21 C886.3408,574.64 888.7605,599.7831 891.0605,623.6131" fill="none" id="compute-to-klein" style="stroke:#4B5563;stroke-width:1;"/><polygon fill="#4B5563" points="891.5408,628.59,894.6577,619.2473,891.0605,623.6131,886.6947,620.0159,891.5408,628.59" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#374151" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="255.8296" x="889.6408" y="595.0103">the only branch reached in the reported runs</text></g><g class="caption" data-source-line="36"><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="1492.5313" x="1" y="724.7803">The decision flow is conceptual structure. Only the FLUX.1-dev skip count is measured (v0.6.3 report). The Klein branch combines the 9B calibration finding with the zero skips the v0.3.0 release notes report; it is not a separate measurement.</text></g><?plantuml-src VLNRRkCs47tNLmmsBmaQgv8lkJX02rkniK2t5_G2z470WgR65X6A54ZAXblqtpia9KTfjkitcSCvPywS6JhX9CBF2k707Dw2EscmlCQgasYNSAhH8BWQmRw85dQ6ALw3iC2uwvYKPp38V7YIK81gcM4Dx1X_EHZTgQhGKXkuseRVACBMhD8deGwmPzBYwAI_PXGQoBFHGOLxractrShzn1g4ZoYFw0HdNuxfaVCyVvZUZq9MnkXJVpXVBnPti_yUZcxFxkVv8X-pG-wOEf1YVoS0QsqgD6-J0Rn7fyXtYZniLziY-IT9NbD-U4QbXVMgM8TjgOeQMGk4tJcmug2ON183oPmuukHJ3deVEjDeQXOrhohLJch-CidwE-p0XB8k1BK6Zq9tDgJ-0Cps6U5gyxnvt6xU42cO5DHgIacI7WpYP0wjbcUb6y5agIXP9RYp8VDEL-U9xfn7v3LbGDWRtKJJ18m0v-zJtPljhBWVOwquxnhFdsHXLMK7jXv0Q5MgQzCfvKLnsX5VqeT7Hqf6jUqxAO7hXj3n9W0nph-AGqMzfWTg2PfIaQoVPVxPrGPj3TUzaI1BfzdDzo6j7uzBtd7Yt_nWU3wEXiFkjMd8kbwKKlsAdOrSUHWIwfuL5StDawSWkmhX6t1CID1AdcDNVBQhvs9RRDxGBsA9KLLg8RKurEv1ze7q1UR9ms1iEnkfwpHa0QENw-B2CSxsqnz_flcamkCjJ1UJ03NiWrBz4eMZIcAdlPtO6Mn3gm2eTFeqw2ZStfRAwdSKk64dIItM9sQge6wfVaHcEyeBrySilKjdnBxLnjqiuSuxVBe8zKPbMgn21KJlIo85ybFuGIAfCr_3j_2uleM7M4Kbh1DI4j1blvLgIwHyJ92r3W2m5muk3cSxVSJ0b0ensj8T7wjt5itHvufJP8BlipIVvNUJB9tF7n_WMkeJaaKfHHUiT7zJgj_fCjKvIpC_obGwWjAEX8nLqyTGwEkaleHwo7l5gbZHeesG4zgWQl9T6AmaJDVm3ocU-2aOlhrra-3VuP_WiYMSqRxzVt36adWa8MWuyOelXsNloQAV948UhWo1aUmoAEfTFRmPmrKwz4UnN9-gKpP9E6l3E7fvAkIq1UbZJmBwjuPh6ldMlpVUNnszF0PJUhCekK_rQjbO5wSzw_ozvd-SbGQOw9AU7LMn4mhZzdbSqo353HXe25Nv_NCIBaxPNsXYbsBuLzhv128meV-0WKN_Yf1MFR46bKl_1G00?></g></svg>