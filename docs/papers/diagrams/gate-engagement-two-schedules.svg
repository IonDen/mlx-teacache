<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="750px" preserveAspectRatio="none" style="width:1550px;height:750px;background:#FFFFFF;" version="1.1" viewBox="0 0 1550 750" width="1550px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="1"><text fill="#111827" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="449.7021" x="546.9316" y="20.7803">One gate, two schedules: where the skip branch is actually reached</text></g><!--entity signal--><g class="entity" data-qualified-name="signal" data-source-line="16" id="ent0001"><rect fill="#EDE9FE" height="62" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="317.3018" x="548.0929" y="42"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="92.6133" x="558.0929" y="62.7803">Denoising step</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="297.3018" x="558.0929" y="76.7803">Cheap input signal: relative-L1 of the modulated</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="238.9229" x="558.0929" y="90.7803">block-0 input against the previous step</text></g><!--entity poly--><g class="entity" data-qualified-name="poly" data-source-line="18" id="ent0002"><rect fill="#FEF3C7" height="48" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="315.7363" x="548.8729" y="165"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="194.5576" x="558.8729" y="185.7803">Calibrated degree-4 polynomial</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="295.7363" x="558.8729" y="199.7803">predicts the body-output change from the signal</text></g><!--entity acc--><g class="entity" data-qualified-name="acc" data-source-line="19" id="ent0003"><rect fill="#FEF3C7" height="48" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="271.3506" x="571.0629" y="274"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="199.999" x="581.0629" y="294.7803">Accumulator adds the prediction</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3506" x="581.0629" y="308.7803">(running total since the last full compute)</text></g><!--entity gate--><g class="entity" data-qualified-name="gate" data-source-line="20" id="ent0004"><rect fill="#FEF3C7" height="48" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="205.2197" x="604.1329" y="383"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="185.2197" x="614.1329" y="403.7803">Accumulated prediction under</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="175.1094" x="614.1329" y="417.7803">rel_l1_thresh (default 0.20)?</text></g><!--entity skip--><g class="entity" data-qualified-name="skip" data-source-line="22" id="ent0005"><rect fill="#DCFCE7" height="48" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="303.6777" x="385.9029" y="506"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="160.2959" x="395.9029" y="526.7803">Skip the transformer body</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="283.6777" x="395.9029" y="540.7803">Reuse the cached residual; prelude + tail only</text></g><!--entity compute--><g class="entity" data-qualified-name="compute" data-source-line="23" id="ent0006"><rect fill="#F8FAFC" height="48" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="303.2607" x="744.1129" y="506"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="147.082" x="754.1129" y="526.7803">Compute the step in full</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="283.2607" x="754.1129" y="540.7803">Refresh the cache; reset the accumulator to 0</text></g><!--entity dev--><g class="entity" data-qualified-name="dev" data-source-line="25" id="ent0007"><rect fill="#DCFCE7" height="90" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="286.8955" x="384.2929" y="629"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="189.1025" x="394.2929" y="649.7803">FLUX.1-dev, 25-step schedule</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="266.8955" x="394.2929" y="663.7803">Predicted changes stay small for stretches,</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="238.8887" x="394.2929" y="677.7803">so the accumulator crawls toward 0.20</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="251.3779" x="394.2929" y="691.7803">Measured: 6 of 25 steps skipped in each</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="263.0469" x="394.2929" y="705.7803">of three runs (v0.6.3, v0.10.0, 2026-11-16)</text></g><!--entity klein--><g class="entity" data-qualified-name="klein" data-source-line="26" id="ent0008"><rect fill="#FECACA" height="76" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="398.2598" x="706.6129" y="636"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="296.4883" x="716.6129" y="656.7803">FLUX.2 Klein 4B / 9B, 8-step distilled schedules</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="308.1709" x="716.6129" y="670.7803">For 9B, the shipped fit predicts above 0.20 across</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="378.2598" x="716.6129" y="684.7803">the observed signal range 0.1316-0.4498 (lowest about 0.27)</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="296.5156" x="716.6129" y="698.7803">The v0.3.0 release notes report no skipped step</text></g><!--link signal to poly--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="28" id="lnk9"><path d="M706.7429,104.25 C706.7429,123.25 706.7429,142.37 706.7429,159.84" fill="none" id="signal-to-poly" style="stroke:#4B5563;stroke-width:1;"/><polygon fill="#4B5563" points="706.7429,164.84,710.7429,155.84,706.7429,159.84,702.7429,155.84,706.7429,164.84" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link poly to acc--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="29" id="lnk10"><path d="M706.7429,213.48 C706.7429,231.32 706.7429,250.75 706.7429,268.57" fill="none" id="poly-to-acc" style="stroke:#4B5563;stroke-width:1;"/><polygon fill="#4B5563" points="706.7429,273.57,710.7429,264.57,706.7429,268.57,702.7429,264.57,706.7429,273.57" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link acc to gate--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="30" id="lnk11"><path d="M706.7429,322.48 C706.7429,340.32 706.7429,359.75 706.7429,377.57" fill="none" id="acc-to-gate" style="stroke:#4B5563;stroke-width:1;"/><polygon fill="#4B5563" points="706.7429,382.57,710.7429,373.57,706.7429,377.57,702.7429,373.57,706.7429,382.57" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link gate to skip--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="31" id="lnk12"><path d="M674.1529,431.33 C644.3229,452.69 604.4684,481.2293 574.5784,502.6293" fill="none" id="gate-to-skip" style="stroke:#4B5563;stroke-width:1;"/><polygon fill="#4B5563" points="570.5129,505.54,580.1593,503.5531,574.5784,502.6293,575.5022,497.0484,570.5129,505.54" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#374151" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="20.23" x="633.3629" y="472.0103">yes</text></g><!--link gate to compute--><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" data-link-type="dependency" data-source-line="32" id="lnk13"><path d="M743.1829,431.33 C776.5429,452.69 821.4518,481.4443 854.8818,502.8443" fill="none" id="gate-to-compute" style="stroke:#4B5563;stroke-width:1;"/><polygon fill="#4B5563" points="859.0929,505.54,853.6695,497.3189,854.8818,502.8443,849.3564,504.0566,859.0929,505.54" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#374151" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="14.46" x="813.5529" y="472.0103">no</text></g><!--link skip to dev--><g class="link" data-entity-1="ent0005" data-entity-2="ent0007" data-link-type="dependency" data-source-line="33" id="lnk14"><path d="M536.0929,554.45 C534.6729,574.54 532.9545,599.0324 531.2245,623.5724" fill="none" id="skip-to-dev" style="stroke:#4B5563;stroke-width:1;"/><polygon fill="#4B5563" points="530.8729,628.56,535.4959,619.8636,531.2245,623.5724,527.5157,619.301,530.8729,628.56" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#374151" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="111.2998" x="534.9329" y="595.0103">reached repeatedly</text></g><!--link compute to klein--><g class="link" data-entity-1="ent0006" data-entity-2="ent0008" data-link-type="dependency" data-source-line="34" id="lnk15"><path d="M897.3929,554.45 C898.9429,576.5 900.9401,604.9025 902.7601,630.6325" fill="none" id="compute-to-klein" style="stroke:#4B5563;stroke-width:1;"/><polygon fill="#4B5563" points="903.1129,635.62,906.4679,626.3602,902.7601,630.6325,898.4879,626.9247,903.1129,635.62" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#374151" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="255.8296" x="901.4429" y="595.0103">the only branch reached in the reported runs</text></g><g class="caption" data-source-line="36"><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="1541.5654" x="1" y="738.7803">The decision flow is conceptual structure. Only the FLUX.1-dev skip count is measured (in each of three runs). The Klein branch combines the 9B calibration finding with the zero skips the v0.3.0 release notes report; it is not a separate measurement.</text></g><?plantuml-src VLNRRkCs47tNLmmsBmvggP9lIHoWXQtOAD3j1Rq0VH2meAcnJOGY3PAouHRxxpia9STk5fkNmE9mpfapPuPEE8dmcqBOCOT3S2SDbk-nRYNQEPpsQ13S7i6-YWDi35Dy3y82uwvbKfx18FFXIK81wi0CQs33-ElEw5RLfPRQmDqw_5r5s3shzKce7MoPj7Xrqbqp2WqK-TL1ZLlMIhVMoltA6eIVK1xH2Sw-7jCX5qNnE7gu2baOeq_TuMGvdSx6_p-ykZr-c1JJufeTSiVKZXJxBm5OQbEZkKq6y1wT8jyfyhXUhClaSvAyfVpmWaeBwrMn3W-LAlV83a3OhGChTeh9EJ6Gp8aZfXyBqDlGcKPJiwXvTQKsKlFNDE_ki1qJoheGT31u5Bgr8VK7OBRB27UhbzNJUdL3f6HIKAif9KcwCuZf10vQdfLk19ELecIruCw6p1jTdrFTEe_8zvG1OMjq4qqJC0ASlqzrhzRZyk4QQy5vstZ-90khQzkpzG12gqeDJAkK5yLfHtn97nuTAHdLjcsb1AuRGiVx0CGu_oOE5VMM7gWbQ2f5idwInIUtDsZtCEYC17asokz_36dzU5poNYV-qm-6v-DeEEnMcuQiwqMfr1_OsiYLXo6XxbbHqzmyUmgohH6-0yU41AtaENR5PxjxATVbweP-6KkCgb8BgSMXTW-o3QGlCCyU1cFRsPMwJaCUC3gvBYwynbb__FkVh4XhF0vXD4q3LByFAlLx58ugYPtsTc9di0sj0g3IwQT1H-5sM2chtr7WXfqajLYVcAc3kfNw1PbjAUySPjxHesceBofn82GgrA-OIWMxanc1365XSCopMJOU0lqlyYmdklbebXP5MioY4QY6hoaPAXp1pn8fysG9tyFJSWYFiTHQM2Ua9DZB4gpKcfZxcA3zFhBQ2WUNCM0RVSHG3bLhjAKxFbPlB9gZpnL7pOJX8BhZOfRcsMJoz0W3gKz8FgOKRV3Rmtsb_gBBLDOuo_syapu8IZjIs-116qS_BkfSnlarr4C6BHVbWhPnX4nfpQhqXp1zIHZ1_Wkr9V6Zql_s_aw2oVilmOfpEAEz_TxRPquyaX3KdtZ5v_sBuCcY7pT2x