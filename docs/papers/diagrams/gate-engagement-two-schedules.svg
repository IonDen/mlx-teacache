<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1313px;height:779px;background:#FFFFFF;" width="1313px" height="779px" viewBox="0 0 1313 779" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7beta11?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="385.251" y="22.995" fill="#111827" font-size="14" textLength="535.985" font-weight="700" font-family="Helvetica">One gate, two schedules: where the skip branch is actually reached</text></g><!--entity signal--><g class="entity" data-qualified-name="signal" id="ent0001" data-source-line="16"><rect x="461.009" y="44.297" width="360.334" height="68.891" fill="#EDE9FE" style="stroke:#4B5563;stroke-width:0.5;" rx="5" ry="5"/><text x="471.009" y="67.292" fill="#111827" font-size="14" textLength="104.398" font-family="Helvetica">Denoising step</text><text x="471.009" y="83.589" fill="#111827" font-size="14" textLength="340.334" font-family="Helvetica">Cheap input signal: relative-L1 of the modulated</text><text x="471.009" y="99.886" fill="#111827" font-size="14" textLength="274.381" font-family="Helvetica">block-0 input against the previous step</text></g><!--entity poly--><g class="entity" data-qualified-name="poly" id="ent0002" data-source-line="18"><rect x="460.759" y="174.187" width="360.84" height="52.594" fill="#FEF3C7" style="stroke:#4B5563;stroke-width:0.5;" rx="5" ry="5"/><text x="470.759" y="197.182" fill="#111827" font-size="14" textLength="221.635" font-family="Helvetica">Calibrated degree-4 polynomial</text><text x="470.759" y="213.479" fill="#111827" font-size="14" textLength="340.84" font-family="Helvetica">predicts the body-output change from the signal</text></g><!--entity acc--><g class="entity" data-qualified-name="acc" id="ent0003" data-source-line="19"><rect x="485.379" y="287.777" width="311.601" height="52.594" fill="#FEF3C7" style="stroke:#4B5563;stroke-width:0.5;" rx="5" ry="5"/><text x="495.379" y="310.772" fill="#111827" font-size="14" textLength="229.154" font-family="Helvetica">Accumulator adds the prediction</text><text x="495.379" y="327.069" fill="#111827" font-size="14" textLength="291.601" font-family="Helvetica">(running total since the last full compute)</text></g><!--entity gate--><g class="entity" data-qualified-name="gate" id="ent0004" data-source-line="20"><rect x="525.049" y="401.367" width="232.263" height="52.594" fill="#FEF3C7" style="stroke:#4B5563;stroke-width:0.5;" rx="5" ry="5"/><text x="535.049" y="424.362" fill="#111827" font-size="14" textLength="212.263" font-family="Helvetica">Accumulated prediction under</text><text x="535.049" y="440.659" fill="#111827" font-size="14" textLength="197.641" font-family="Helvetica">rel_l1_thresh (default 0.20)?</text></g><!--entity skip--><g class="entity" data-qualified-name="skip" id="ent0005" data-source-line="22"><rect x="279.779" y="530.967" width="344.803" height="52.594" fill="#DCFCE7" style="stroke:#4B5563;stroke-width:0.5;" rx="5" ry="5"/><text x="289.779" y="553.962" fill="#111827" font-size="14" textLength="183.969" font-family="Helvetica">Skip the transformer body</text><text x="289.779" y="570.259" fill="#111827" font-size="14" textLength="324.803" font-family="Helvetica">Reuse the cached residual; prelude + tail only</text></g><!--entity compute--><g class="entity" data-qualified-name="compute" id="ent0006" data-source-line="23"><rect x="659.459" y="530.967" width="343.449" height="52.594" fill="#F8FAFC" style="stroke:#4B5563;stroke-width:0.5;" rx="5" ry="5"/><text x="669.459" y="553.962" fill="#111827" font-size="14" textLength="169.244" font-family="Helvetica">Compute the step in full</text><text x="669.459" y="570.259" fill="#111827" font-size="14" textLength="323.449" font-family="Helvetica">Refresh the cache; reset the accumulator to 0</text></g><!--entity dev--><g class="entity" data-qualified-name="dev" id="ent0007" data-source-line="25"><rect x="290.629" y="660.557" width="323.099" height="85.188" fill="#DCFCE7" style="stroke:#4B5563;stroke-width:0.5;" rx="5" ry="5"/><text x="300.629" y="683.552" fill="#111827" font-size="14" textLength="209.125" font-family="Helvetica">FLUX.1-dev, 25-step schedule</text><text x="300.629" y="699.849" fill="#111827" font-size="14" textLength="303.099" font-family="Helvetica">Predicted changes stay small for stretches,</text><text x="300.629" y="716.146" fill="#111827" font-size="14" textLength="273.287" font-family="Helvetica">so the accumulator crawls toward 0.20</text><text x="300.629" y="732.443" fill="#111827" font-size="14" textLength="228.02" font-family="Helvetica">Measured: 6 of 25 steps skipped</text></g><!--entity klein--><g class="entity" data-qualified-name="klein" id="ent0008" data-source-line="26"><rect x="651.139" y="660.557" width="360.081" height="85.188" fill="#FECACA" style="stroke:#4B5563;stroke-width:0.5;" rx="5" ry="5"/><text x="661.139" y="683.552" fill="#111827" font-size="14" textLength="329.841" font-family="Helvetica">FLUX.2 Klein 4B / 9B, 8-step distilled schedules</text><text x="661.139" y="699.849" fill="#111827" font-size="14" textLength="325.603" font-family="Helvetica">The shipped fit predicts above 0.20 across the</text><text x="661.139" y="716.146" fill="#111827" font-size="14" textLength="320.981" font-family="Helvetica">observed signal range (0.1316-0.4498 for 9B)</text><text x="661.139" y="732.443" fill="#111827" font-size="14" textLength="340.081" font-family="Helvetica">Measured: 0 of 8 steps skipped, every repetition</text></g><!--link signal to poly--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk9" data-source-line="28" data-link-type="dependency"><path d="M641.179,113.417 C641.179,132.647 641.179,151.367 641.179,169.027" style="stroke:#4B5563;stroke-width:1;" fill="none" id="signal-to-poly"/><polygon points="641.179,174.027,645.179,165.027,641.179,169.027,637.179,165.027,641.179,174.027" fill="#4B5563" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link poly to acc--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk10" data-source-line="29" data-link-type="dependency"><path d="M641.179,227.087 C641.179,245.227 641.179,264.477 641.179,282.597" style="stroke:#4B5563;stroke-width:1;" fill="none" id="poly-to-acc"/><polygon points="641.179,287.597,645.179,278.597,641.179,282.597,637.179,278.597,641.179,287.597" fill="#4B5563" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link acc to gate--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk11" data-source-line="30" data-link-type="dependency"><path d="M641.179,340.677 C641.179,358.827 641.179,378.067 641.179,396.187" style="stroke:#4B5563;stroke-width:1;" fill="none" id="acc-to-gate"/><polygon points="641.179,401.187,645.179,392.187,641.179,396.187,637.179,392.187,641.179,401.187" fill="#4B5563" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link gate to skip--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk12" data-source-line="31" data-link-type="dependency"><path d="M603.389,454.187 C570.529,476.367 527.303,505.549 494.373,527.779" style="stroke:#4B5563;stroke-width:1;" fill="none" id="gate-to-skip"/><polygon points="490.229,530.577,499.926,528.857,494.373,527.779,495.45,522.226,490.229,530.577" fill="#4B5563" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="559.179" y="497.034" fill="#374151" font-size="13" textLength="22.464" font-family="Helvetica">yes</text></g><!--link gate to compute--><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" id="lnk13" data-source-line="32" data-link-type="dependency"><path d="M679.169,454.187 C712.199,476.367 755.668,505.56 788.778,527.79" style="stroke:#4B5563;stroke-width:1;" fill="none" id="gate-to-compute"/><polygon points="792.929,530.577,787.686,522.239,788.778,527.79,783.227,528.881,792.929,530.577" fill="#4B5563" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="749.179" y="497.034" fill="#374151" font-size="13" textLength="16.193" font-family="Helvetica">no</text></g><!--link skip to dev--><g class="link" data-entity-1="ent0005" data-entity-2="ent0007" id="lnk14" data-source-line="33" data-link-type="dependency"><path d="M452.179,583.987 C452.179,605.167 452.179,630.617 452.179,655.297" style="stroke:#4B5563;stroke-width:1;" fill="none" id="skip-to-dev"/><polygon points="452.179,660.297,456.179,651.297,452.179,655.297,448.179,651.297,452.179,660.297" fill="#4B5563" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="453.179" y="626.624" fill="#374151" font-size="13" textLength="127.29" font-family="Helvetica">reached repeatedly</text></g><!--link compute to klein--><g class="link" data-entity-1="ent0006" data-entity-2="ent0008" id="lnk15" data-source-line="34" data-link-type="dependency"><path d="M831.179,583.987 C831.179,605.167 831.179,630.617 831.179,655.297" style="stroke:#4B5563;stroke-width:1;" fill="none" id="compute-to-klein"/><polygon points="831.179,660.297,835.179,651.297,831.179,655.297,827.179,651.297,831.179,660.297" fill="#4B5563" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="832.179" y="626.624" fill="#374151" font-size="13" textLength="192.531" font-family="Helvetica">the only branch ever reached</text></g><g class="caption" data-source-line="36"><text x="1" y="767.739" fill="#111827" font-size="14" textLength="1304.488" font-family="Helvetica">The decision flow is conceptual structure; the two skip counts are measured, repetition-stable results. The Klein branch summarizes the calibration finding, not a separate measurement.</text></g><?plantuml-src VLLDR-Cs4BthLmmsbmIrl9PZ9uuNsC9MR2pGxGUw