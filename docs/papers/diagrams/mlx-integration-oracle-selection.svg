<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="645px" preserveAspectRatio="none" style="width:1052px;height:645px;background:#FFFFFF;" version="1.1" viewBox="0 0 1052 645" width="1052px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><g class="title" data-source-line="1"><text fill="#111827" font-family="Helvetica" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="390.1406" x="327.4502" y="22.9951">One integration, four questions, four test oracles</text></g><!--entity claim--><g class="entity" data-qualified-name="claim" data-source-line="18" id="ent0001"><rect fill="#DBEAFE" height="52.5938" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="149.7598" x="218.2914" y="44.2969"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="129.7598" x="228.2914" y="67.292">What claim should</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="119.9434" x="228.2914" y="83.5889">the test support?</text></g><!--entity q1--><g class="entity" data-qualified-name="q1" data-source-line="20" id="ent0002"><rect fill="#EDE9FE" height="52.5938" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="169.1465" x="139.6014" y="165.0469"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="149.1465" x="149.6014" y="188.042">1. Did the committed</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="113.8115" x="149.6014" y="204.3389">artifact change?</text></g><!--entity q2--><g class="entity" data-qualified-name="q2" data-source-line="21" id="ent0003"><rect fill="#EDE9FE" height="52.5938" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="236.9795" x="72.6814" y="293.9369"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="187.2568" x="82.6814" y="316.932">2. Does the no-op wrapper</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="216.9795" x="82.6814" y="333.2289">preserve the underlying math?</text></g><!--entity q3--><g class="entity" data-qualified-name="q3" data-source-line="22" id="ent0004"><rect fill="#EDE9FE" height="52.5938" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="224.1348" x="156.1014" y="422.8269"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="180.4688" x="166.1014" y="445.822">3. Is a changed execution</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="204.1348" x="166.1014" y="462.1189">path numerically equivalent?</text></g><!--entity q4--><g class="entity" data-qualified-name="q4" data-source-line="23" id="ent0005"><rect fill="#EDE9FE" height="52.5938" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="248.6074" x="308.8714" y="551.7169"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="148.3057" x="318.8714" y="574.712">4. Is the intentionally</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="228.6074" x="318.8714" y="591.0089">approximate output acceptable?</text></g><!--entity o1--><g class="entity" data-qualified-name="o1" data-source-line="25" id="ent0006"><rect fill="#F8FAFC" height="68.8906" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="323.96" x="512.1914" y="156.8969"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="132.959" x="522.1914" y="179.892">Artifact-drift oracle</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="303.96" x="522.1914" y="196.1889">Exact SHA-256 + pinned upstream revision</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="234.8281" x="522.1914" y="212.4857">Failure means: something moved</text></g><!--entity o2--><g class="entity" data-qualified-name="o2" data-source-line="26" id="ent0007"><rect fill="#DCFCE7" height="68.8906" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="427.9414" x="486.2014" y="285.7869"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="193.4502" x="496.2014" y="308.782">Paired same-process oracle</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="379.5996" x="496.2014" y="325.0789">vanilla -&gt; wrapper at threshold 0 -&gt; restore -&gt; vanilla</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="407.9414" x="496.2014" y="341.3757">Exact only where measurement supports it; assert 0 skips</text></g><!--entity o3--><g class="entity" data-qualified-name="o3" data-source-line="27" id="ent0008"><rect fill="#FEF3C7" height="68.8906" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="486.3682" x="485.9914" y="414.6769"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="199.124" x="495.9914" y="437.672">Per-variant numerical oracle</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="466.3682" x="495.9914" y="453.9689">Use byte equality where stable; otherwise use a documented gate</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="383.0723" x="495.9914" y="470.2657">Mark it provisional when the full distribution is missing</text></g><!--entity o4--><g class="entity" data-qualified-name="o4" data-source-line="28" id="ent0009"><rect fill="#FCE7F3" height="68.8906" rx="5" ry="5" style="stroke:#4B5563;stroke-width:0.5;" width="262.1904" x="595.0714" y="543.5669"/><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="207.2725" x="605.0714" y="566.562">Quality + engagement oracle</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="242.1904" x="605.0714" y="582.8589">SSIM against same-process vanilla</text><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="233.543" x="605.0714" y="599.1557">plus a calibrated skip-count band</text></g><!--link claim to q1--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="30" id="lnk10"><path d="M278.2014,97.3669 C266.6214,117.2769 253.1936,140.3938 241.6236,160.3038" fill="none" id="claim-to-q1" style="stroke:#4B5563;stroke-width:1;"/><polygon fill="#4B5563" points="239.1114,164.6269,247.0918,158.8551,241.6236,160.3038,240.1749,154.8356,239.1114,164.6269" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link claim to q2--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="dependency" data-source-line="31" id="lnk11"><path d="M217.8414,89.4169 C182.3214,102.0069 143.2014,122.8969 122.1714,156.8969 C94.2214,202.0769 132.5059,256.8611 162.2359,289.8811" fill="none" id="claim-to-q2" style="stroke:#4B5563;stroke-width:1;"/><polygon fill="#4B5563" points="165.5814,293.5969,162.532,284.232,162.2359,289.8811,156.5868,289.5849,165.5814,293.5969" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link claim to q3--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" data-link-type="dependency" data-source-line="32" id="lnk12"><path d="M305.9614,97.3869 C313.4614,113.9369 322.2114,136.1469 326.1714,156.8969 C342.6414,243.2469 351.6014,270.2369 327.1714,354.6769 C319.8714,379.9269 306.5273,400.9517 292.8773,418.7217" fill="none" id="claim-to-q3" style="stroke:#4B5563;stroke-width:1;"/><polygon fill="#4B5563" points="289.8314,422.6869,298.4861,417.9862,292.8773,418.7217,292.1418,413.1128,289.8314,422.6869" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link claim to q4--><g class="link" data-entity-1="ent0001" data-entity-2="ent0005" data-link-type="dependency" data-source-line="33" id="lnk13"><path d="M317.8314,97.1469 C331.8314,113.0869 348.4414,134.7369 358.1714,156.8969 C419.7014,296.9669 430.625,479.419 432.595,546.679" fill="none" id="claim-to-q4" style="stroke:#4B5563;stroke-width:1;"/><polygon fill="#4B5563" points="432.7414,551.6769,436.4762,542.5636,432.595,546.679,428.4796,542.7978,432.7414,551.6769" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link q1 to o1--><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" data-link-type="dependency" data-source-line="35" id="lnk14"><path d="M308.9814,191.3369 C376.6214,191.3369 439.2614,191.3369 506.9014,191.3369" fill="none" id="q1-to-o1" style="stroke:#4B5563;stroke-width:1;"/><polygon fill="#4B5563" points="511.9014,191.3369,502.9014,187.3369,506.9014,191.3369,502.9014,195.3369,511.9014,191.3369" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link q2 to o2--><g class="link" data-entity-1="ent0003" data-entity-2="ent0007" data-link-type="dependency" data-source-line="36" id="lnk15"><path d="M309.9714,320.2269 C368.6514,320.2269 422.3314,320.2269 481.0214,320.2269" fill="none" id="q2-to-o2" style="stroke:#4B5563;stroke-width:1;"/><polygon fill="#4B5563" points="486.0214,320.2269,477.0214,316.2269,481.0214,320.2269,477.0214,324.2269,486.0214,320.2269" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link q3 to o3--><g class="link" data-entity-1="ent0004" data-entity-2="ent0008" data-link-type="dependency" data-source-line="37" id="lnk16"><path d="M380.7214,449.1169 C415.6514,449.1169 445.5914,449.1169 480.5314,449.1169" fill="none" id="q3-to-o3" style="stroke:#4B5563;stroke-width:1;"/><polygon fill="#4B5563" points="485.5314,449.1169,476.5314,445.1169,480.5314,449.1169,476.5314,453.1169,485.5314,449.1169" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link q4 to o4--><g class="link" data-entity-1="ent0005" data-entity-2="ent0009" data-link-type="dependency" data-source-line="38" id="lnk17"><path d="M557.9214,578.0069 C570.1914,578.0069 577.4614,578.0069 589.7314,578.0069" fill="none" id="q4-to-o4" style="stroke:#4B5563;stroke-width:1;"/><polygon fill="#4B5563" points="594.7314,578.0069,585.7314,574.0069,589.7314,578.0069,585.7314,582.0069,594.7314,578.0069" style="stroke:#4B5563;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link q1 to q2--><!--link q2 to q3--><!--link q3 to q4--><!--link o1 to o2--><!--link o2 to o3--><!--link o3 to o4--><g class="caption" data-source-line="47"><text fill="#111827" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="1043.041" x="1" y="634.4526">Conceptual test-selection map. It summarizes the shipped oracle split; it does not identify the unisolated cause of the cross-process byte difference.</text></g><?plantuml-src RLN1RkCs4BthAmQRurR1odOssoxGmd4ix1vsso8eUcXw68iZYGZ5aKdAJbhqtpkKP5kn4o10A99l7jzxCmaw689VBO6sWIg7GRFz0Khk76mxyd7fntMG9R33mf1Fai0j18ODXy0DAEseY8UJn3zfswB31ZPOF5MEEwjMRDZ1LTx_J4xu6XNljQsWHEDfiZDUSvOSP1yc6ufAx4p8sORls11y8REZe0jy-ynOESkoJxFRoP6bSxmVDnTtDpSVv-URazlpsqLsaqtPoMFHLYBTlmd07Jj5xZKOm6LrENcXoATycQ-I_vBa1Fdkpne350Pr58Wxenvjg6dGttTjooxyyWxGZsUkxk_Motpz2YAxXdkj85uhk6bq22Gew88kiH3mMixH0BBDu6fzl_vH42O0Cm5WyZs2vLJCtZjiMtAFjdNaoUsetvEda3ClqS86Gpr2pjw2d5_3Lmyu5bT0prHqCJC2ALV1TWqvCTAO5w1jftTeo8ultSxVGbpqY956JA-DMF6sFBHj7JzhOKJ0NMYx05WKr0RScCEp5qV4AUHob2XLJfU7k3_QzNEKxU7BCftTV8Jtq6fhvGbTwuEZFX0xxVkdvAXDvmWQGkj_0iyDXRgNXtUa-jAS7OsVLFuDfOSKU0brAkmBylvOVeTM6uEG_dom0IGYeHOdQZOAFiGTMGIMolBdUFx0cwr8kgzfeEM5NYDg7RBaGOVFmajC3O8aAM_zm5Dil5_bg_NjAvxaqXqwZO9mjEp8z0zFi7aHsSL1D3eSwlfU-i_0ufRRQpdLoI-2ugABPEJbbRZrQB-XUn92818CaWguGDZUvh8pHcQDYAu