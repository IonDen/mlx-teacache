[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "mlx-teacache"
dynamic = ["version"]
description = "TeaCache step-skipping for FLUX, Qwen-Image & Z-Image diffusion on Apple Silicon, in pure MLX"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Denis Ineshin", email = "denis.ineshin@gmail.com" }]
keywords = [
    "mlx", "apple-silicon", "diffusion", "flux", "flux1", "flux2",
    "mflux", "teacache", "inference-acceleration", "step-skipping",
    "image-generation", "cfg", "qwen-image", "qwen", "z-image",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["mlx>=0.31", "numpy"]

[project.optional-dependencies]
mflux = ["mflux>=0.17.5,<0.19"]

[project.urls]
Homepage = "https://github.com/IonDen/mlx-teacache"
Source = "https://github.com/IonDen/mlx-teacache"
Issues = "https://github.com/IonDen/mlx-teacache/issues"
Changelog = "https://github.com/IonDen/mlx-teacache/blob/main/CHANGELOG.md"
Comparison = "https://github.com/IonDen/mlx-teacache/blob/main/COMPARISON.md"
Roadmap = "https://github.com/IonDen/mlx-teacache/blob/main/ROADMAP.md"

[dependency-groups]
test-core = [
    "pytest>=8",
    "pytest-cov",
    "hypothesis>=6",
    'tomli>=2.0; python_version < "3.11"',
]
test-mflux = [
    { include-group = "test-core" },
    "mflux>=0.17.5,<0.19",
    "mlx-taef>=0.1.1",
    "scikit-image",
]
lint = ["ruff>=0.5"]
typecheck = ["mypy>=1.10"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/mlx_teacache/_version.py"

[tool.hatch.build.targets.sdist]
include = ["src/", "scripts/", "docs/", "LICENSE", "NOTICE", "README.md", "CHANGELOG.md", "pyproject.toml"]
exclude = [
    ".hypothesis/",
    "tests/reference/",          # nested per-variant subdirs and all .safetensors
    "tests/reference_pngs/",     # nested PNGs from slow integration tests
    "tests/converted/",
    "notes/",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mlx_teacache"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "TID"]
ignore = ["E501"]  # line-length handled by formatter

[tool.mypy]
strict = true
files = ["src/mlx_teacache"]
python_version = "3.10"

[[tool.mypy.overrides]]
module = ["mflux.*", "mlx.*", "mlx_taef.*", "skimage.*", "lpips.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "slow: integration tests that load real weights (nightly)",
    "network: tests that download from HuggingFace",
    "gpu: tests requiring Metal device",
    "benchmark: performance regression tests",
    "parity: tests requiring mflux + macOS-ARM64",
    "mflux: tests requiring mflux installed (skipped on test-pure-core)",
]
filterwarnings = [
    "error",
    # tokenizers 0.9.0 emits BPE.__init__ DeprecationWarning during CLIPTokenizer
    # construction; mflux catches it and re-raises as RuntimeError, breaking
    # Flux1.from_name() under `filterwarnings = error`. The warning originates in
    # the Rust tokenizers extension but surfaces in transformers.models.clip —
    # both module patterns must be suppressed.
    "ignore::DeprecationWarning:tokenizers",
    "ignore::DeprecationWarning:transformers",
    # huggingface_hub's xet download path emits "hf_xet.download_files() is
    # deprecated" during snapshot_download; under `filterwarnings = error` that
    # turns any uncached-weight fixture into a setup ERROR (seen 2026-08-14 on
    # the FLUX.1-schnell fixture). Suppress in both the emitting binding and
    # the calling package, mirroring the tokenizers/transformers pair above.
    "ignore::DeprecationWarning:huggingface_hub",
    "ignore::DeprecationWarning:hf_xet",
]

[tool.coverage.run]
branch = true
source = ["mlx_teacache"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
# fail_under is intentionally NOT set globally — the per-PR `coverage` CI job
# (see ci.yml) combines results across test-core + test-mflux and gates against
# a FLOOR (currently 58%), not 100%: ~35% of the package is only reachable with
# real weights (the parity lane), so 100% combined is structurally impossible
# off that lane. The real release-quality gate is the manual parity run that
# must pass before tagging. Per-task TDD runs should NOT trigger a global gate.
