# Pinned HuggingFace revisions used to generate the committed reference
# fixtures in tests/reference/. tests/test_hf_revisions.py asserts the
# local HF cache's `refs/main` for each repo matches these SHAs before
# parity tests run, so a silent upstream model update can't make our
# bit-exact tests start failing without a clear remediation message.
#
# To re-pin (e.g. after intentionally regenerating fixtures against a
# newer model revision):
#   1. Update the sha below to the new commit (cat ~/.cache/huggingface/
#      hub/models--<org>--<repo>/refs/main).
#   2. Regenerate the affected fixtures via tests/generate_references.py.
#   3. Update tests/fixtures.toml in the same commit.
#
# To restore a pinned revision after upstream drift:
#   hf download <org>/<repo> --revision <sha>

